name: CityFix community release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: cityfix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Web and Android community artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build web client
        run: pnpm run check

      - name: Package web build
        run: |
          mkdir -p release
          cd dist
          zip -r ../release/cityfix-web-dist.zip .
          cd ..

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Assemble Android debug APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Stage Android test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk release/cityfix-android-debug.apk

      - name: Generate checksums
        run: |
          cd release
          sha256sum cityfix-web-dist.zip cityfix-android-debug.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/cityfix-web-dist.zip
            release/cityfix-android-debug.apk
            release/SHA256SUMS.txt
